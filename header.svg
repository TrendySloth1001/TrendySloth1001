<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none" role="img" aria-label="Nikhil Binwal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111B33"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6EDF7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7DD3FC" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E6EDF7" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-420 0; 1300 0; 1300 0" dur="6s" repeatCount="indefinite"
        keyTimes="0; 0.55; 1" calcMode="spline" keySplines="0.4 0 0.2 1; 0 0 1 1"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#7DD3FC" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="280" rx="16"/></clipPath>
    <style>
      .n { font-family: "SFMono-Regular", "JetBrains Mono", Consolas, monospace; }
      .rise { opacity: 0; animation: rise .9s cubic-bezier(.22,1,.36,1) forwards; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .35s } .d3 { animation-delay: .55s }
      @keyframes rise { from { opacity:0; transform: translateY(14px) } to { opacity:1; transform: translateY(0) } }
      .role { opacity: 0; animation: cycle 12s linear infinite; }
      .r2 { animation-delay: 4s } .r3 { animation-delay: 8s }
      @keyframes cycle {
        0% { opacity:0; transform: translateY(6px) }
        4%,29% { opacity:1; transform: translateY(0) }
        33%,100% { opacity:0; transform: translateY(-6px) }
      }
      .caret { animation: blink 1.1s steps(1) infinite }
      @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      .drift { animation: drift 9s ease-in-out infinite alternate }
      .drift2 { animation: drift 11s ease-in-out infinite alternate-reverse }
      @keyframes drift { from { transform: translate(0,0) } to { transform: translate(46px,-22px) } }
      @media (prefers-reduced-motion: reduce) {
        .rise,.role,.caret,.drift,.drift2,.rings * { animation: none; opacity: 1; transform: none }
        .r2,.r3 { display: none }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <ellipse class="drift"  cx="215" cy="70"  rx="330" ry="210" fill="url(#glowA)"/>
    <ellipse class="drift2" cx="1010" cy="235" rx="340" ry="220" fill="url(#glowB)"/>


    <g class="rings" transform="translate(1010 140)" fill="none" stroke="#7DD3FC">
      <circle r="34"  stroke-opacity="0.55" stroke-width="1.5">
        <animate attributeName="r" values="34;120;120" dur="5s" repeatCount="indefinite"
          keyTimes="0;0.75;1" calcMode="spline" keySplines="0.2 0.6 0.2 1;0 0 1 1"/>
        <animate attributeName="stroke-opacity" values="0.55;0;0" dur="5s" repeatCount="indefinite" keyTimes="0;0.75;1"/>
      </circle>
      <circle r="34" stroke-opacity="0.55" stroke-width="1.5">
        <animate attributeName="r" values="34;120;120" dur="5s" begin="1.7s" repeatCount="indefinite"
          keyTimes="0;0.75;1" calcMode="spline" keySplines="0.2 0.6 0.2 1;0 0 1 1"/>
        <animate attributeName="stroke-opacity" values="0.55;0;0" dur="5s" begin="1.7s" repeatCount="indefinite" keyTimes="0;0.75;1"/>
      </circle>
      <circle r="34" stroke-opacity="0.55" stroke-width="1.5">
        <animate attributeName="r" values="34;120;120" dur="5s" begin="3.4s" repeatCount="indefinite"
          keyTimes="0;0.75;1" calcMode="spline" keySplines="0.2 0.6 0.2 1;0 0 1 1"/>
        <animate attributeName="stroke-opacity" values="0.55;0;0" dur="5s" begin="3.4s" repeatCount="indefinite" keyTimes="0;0.75;1"/>
      </circle>
      <circle r="5" fill="#38BDF8" stroke="none" fill-opacity="0.9"/>
      <circle r="26" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 7">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text class="n rise d1" x="72" y="112" font-size="19" letter-spacing="7" fill="#7DD3FC" fill-opacity="0.85">$ whoami</text>

    <text class="n rise d2" x="70" y="176" font-size="54" font-weight="700" letter-spacing="1" fill="#E8EEF9">Nikhil Binwal</text>
    <text class="n" x="70" y="176" font-size="54" font-weight="700" letter-spacing="1" fill="url(#sweep)">Nikhil Binwal</text>

    <g class="n" font-size="20" fill="#AFC4E2">
      <text class="role"    x="94" y="224">Fourth-year CSE student, AI/ML</text>
      <text class="role r2" x="94" y="224">Flutter and TypeScript across the stack</text>
      <text class="role r3" x="94" y="224">Chasing the edge cases that become the problem</text>
    </g>
    <rect class="caret" x="70" y="206" width="10" height="22" fill="#38BDF8"/>

    <rect class="rise d3" x="70" y="248" width="420" height="2" rx="1" fill="url(#rule)"/>
    <rect x="0" y="0" width="1200" height="280" rx="16" fill="none" stroke="#7DD3FC" stroke-opacity="0.16"/>
  </g>
</svg>
